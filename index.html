<!DOCTYPE html>
<html dir="rtl" lang="ar">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<body style="font-family:sans-serif;max-width:500px;margin:auto;text-align:right;padding:10px">
  <h3>اكتب رمز المادة</h3>
  <input id="code" placeholder="رمز المادة" style="width:100%;padding:8px">
  <button onclick="s()" style="width:100%;padding:8px;margin-top:5px">بحث</button>
  <div id="r" style="margin-top:15px"></div>

  <script>
    async function s(){
      let c = document.getElementById('code').value.trim();
      if(!c) return r.innerHTML = "يرجى إدخال الرمز.";
      
      let u = "https://script.google.com/macros/s/AKfycbxeWytcbPgkPdUUX71LQQw9GhzvsLbOOzj41NAb9feMpRUEwYaUwAICCCgrD8GgslECkQ/exec?code=" + encodeURIComponent(c);
      
      try {
        let d = await (await fetch(u)).json();
        if(!d.length) return r.innerHTML = "رصيد 0.";
        
        let h = `<b>${d[0].name}</b><table border=1 width=100%><tr><th>المستودع</th><th>الرصيد</th></tr>`;
        d.forEach(i => h += `<tr><td>${i.warehouse}</td><td>${i.balance}</td></tr>`);
        r.innerHTML = h + "</table>";
      } catch(e) {
        r.innerHTML = "حدث خطأ.";
      }
    }
  </script>
</body>
</html>
